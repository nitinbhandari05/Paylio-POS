services:
  - type: web
    name: paylio-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci --include=optional
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        sync: false
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: paylio-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=optional && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
